{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Расписание тренировок</h1>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for item in classes %}
    <div class="bg-white rounded-2xl shadow-sm border hover:shadow-md transition p-6">
        <div class="flex justify-between items-start mb-4">
            <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full">{{ item.workout_type.name }}</span>
            <span class="text-gray-400 text-sm"><i class="far fa-clock mr-1"></i>{{ item.start_time.strftime('%H:%M') }}</span>
        </div>
        <h3 class="text-lg font-bold mb-1">{{ item.workout_type.name }}</h3>
        <p class="text-gray-500 text-sm mb-4">Тренер: <span class="text-gray-800 font-medium">{{ item.trainer.user.full_name }}</span></p>
        <div class="flex items-center justify-between mt-6 pt-4 border-t">
            <div class="text-xs text-gray-400">Зал: {{ item.gym.name }}</div>
            <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-indigo-700">Записаться</button>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
