{% extends "base.html" %}
{% block content %}
<div class="space-y-8">
    <!-- Секция отчетов -->
    <div class="bg-white p-6 rounded-xl shadow-sm">
        <h2 class="text-xl font-bold mb-4 text-red-600">Система отчетов и бэкапов</h2>
        <div class="flex space-x-4">
            <a href="/reports/visits?format=xlsx" class="bg-green-600 text-white px-4 py-2 rounded">Экспорт в Excel</a>
            <a href="/reports/visits?format=json" class="bg-gray-800 text-white px-4 py-2 rounded">Экспорт в JSON</a>
            <form action="/auth/backup" method="post">
                <button type="submit" class="bg-orange-500 text-white px-4 py-2 rounded">Создать бэкап БД</button>
            </form>
        </div>
    </div>

    <!-- Залы -->
    <div class="bg-white p-6 rounded-xl shadow-sm">
        <h2 class="text-xl font-bold mb-4">Управление залами</h2>
        <ul class="list-disc ml-5">
            {% for gym in gyms %}
            <li>{{ gym.name }} (вместимость: {{ gym.capacity }})</li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
