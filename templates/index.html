{% extends "base.html" %}
{% block content %}
<div class="bg-white p-8 rounded-3xl shadow-sm border">
    <h1 class="text-3xl font-bold">Привет, {{ user.full_name }}!</h1>
    <p class="text-gray-500 mt-2">Твоя карта: <b>{{ client.card_number }}</b></p>
    
    <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-indigo-600 text-white p-6 rounded-2xl">
            <h2 class="text-lg font-bold">Твой статус</h2>
            <p class="text-4xl mt-2 font-black">ACTIVE</p>
        </div>
        <div class="bg-gray-100 p-6 rounded-2xl">
            <h2 class="text-lg font-bold text-gray-700">Записаться</h2>
            <p class="text-gray-500">Посмотри доступные тренировки</p>
            <a href="/schedule" class="inline-block mt-4 text-indigo-600 font-bold">Перейти →</a>
        </div>
    </div>
</div>
{% endblock %}
