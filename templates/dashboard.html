{% extends "base.html" %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">

    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <div class="text-gray-500 text-sm">Активных клиентов</div>
        <div class="text-3xl font-bold text-indigo-600">1,284</div>
