{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
    <div class="bg-white p-6 rounded-xl shadow-sm border">
        <h2 class="font-bold mb-4 text-indigo-700">Выдать новый абонемент</h2>
        <form action="/ops/add-subscription" method="post" class="flex space-x-4">
            <select name="client_id" class="border p-2 rounded flex-1">
                {% for c in clients %}<option value="{{ c.id }}">{{ c.user.full_name }}</option>{% endfor %}
            </select>
            <select name="type_id" class="border p-2 rounded flex-1">
                {% for t in sub_types %}<option value="{{ t.id }}">{{ t.name }} ({{ t.price }}₽)</option>{% endfor %}
            </select>
            <button type="submit" class="bg-indigo-600 text-white px-6 rounded">Оформить</button>
        </form>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-sm border">
        <h2 class="font-bold mb-4">Активные абонементы</h2>
        <div class="grid grid-cols-2 gap-4">
            {% for sub in subs %}
            <div class="border p-4 rounded-lg flex justify-between bg-gray-50">
                <div>
                    <div class="font-bold">{{ sub.client.user.full_name }}</div>
                    <div class="text-sm text-indigo-600">{{ sub.sub_type.name }}</div>
                </div>
                <div class="text-right">
                    <div class="text-xs text-gray-400">Действует до</div>
                    <div class="font-mono text-sm">{{ sub.end_date.strftime('%d.%m.%Y') }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
