<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-50 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-96">
        <h1 class="text-2xl font-bold mb-6 text-center text-indigo-900">Регистрация</h1>
        
        <!-- Форма отправляет данные в app/api/auth.py на роут /auth/register -->
        <form action="/auth/register" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">ФИО</label>
                <input type="text" name="full_name" class="w-full border p-2 rounded mt-1" placeholder="Иван Иванов" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" name="email" class="w-full border p-2 rounded mt-1" placeholder="mail@example.com" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Пароль</label>
                <input type="password" name="password" class="w-full border p-2 rounded mt-1" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold hover:bg-indigo-700 transition">
                Создать аккаунт
            </button>
        </form>
        
        <p class="text-sm mt-6 text-center text-gray-500">
            Уже есть аккаунт? <a href="/login" class="text-indigo-600 font-bold">Войти</a>
        </p>
    </div>
</body>
</html>
