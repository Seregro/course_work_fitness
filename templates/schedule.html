{% extends "base.html" %}
{% block content %}
<div class="bg-white rounded-xl shadow-sm p-6">
    <h2 class="text-xl font-bold mb-6">Расписание тренировок</h2>
    <div class="grid grid-cols-1 gap-4">
        {% for item in schedules %}
        <div class="border p-4 rounded-lg flex justify-between items-center hover:shadow-md transition">
            <div>
                <div class="text-indigo-600 font-bold text-lg">{{ item.workout_type.name }}</div>
                <div class="text-gray-500">{{ item.start_time.strftime('%H:%M') }} - {{ item.end_time.strftime('%H:%M') }}</div>
            </div>
            <div class="text-right">
                <div class="font-medium">{{ item.trainer.user.full_name }}</div>
                <div class="text-sm text-gray-400">{{ item.gym.name }}</div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
