<body class="bg-indigo-50 flex items-center justify-center h-screen">
    <script src="https://cdn.tailwindcss.com"></script>
    <form action="/auth/login" method="post" class="bg-white p-8 rounded-2xl shadow-lg w-80">
        <h1 class="text-2xl font-bold mb-6">Вход</h1>
        <input name="email" type="email" placeholder="Email" class="w-full border p-2 mb-4 rounded" required>
        <input name="password" type="password" placeholder="Пароль" class="w-full border p-2 mb-4 rounded" required>
        <button class="w-full bg-indigo-600 text-white p-2 rounded font-bold">Войти</button>
        <p class="text-sm mt-4 text-center">Нет аккаунта? <a href="/register" class="text-indigo-600">Регистрация</a></p>
    </form>
</body>
