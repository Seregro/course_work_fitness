<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-900 flex items-center justify-center h-screen">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-indigo-900">FitnessPro</h1>
            <p class="text-gray-400 mt-2">Войдите в систему</p>
        </div>

        <!-- ПРОВЕРЬ: action должен быть в точности /auth/login/html, метод POST -->
        <form action="/auth/login/html" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <!-- ПРОВЕРЬ: name должен быть "username" для FastAPI OAuth2 -->
                <input type="email" 
                       name="username" 
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none" 
                       placeholder="admin@fit.ru" 
                       required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Пароль</label>
                <!-- ПРОВЕРЬ: name="password" -->
                <input type="password" 
                       name="password" 
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 outline-none" 
                       placeholder="••••••••" 
                       required>
            </div>

            <!-- ПРОВЕРЬ: кнопка ДОЛЖНА иметь type="submit" -->
            <button type="submit" 
                    class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-indigo-700 shadow-lg transition duration-200">
                Войти
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-500">Нет аккаунта? <a href="/register" class="text-indigo-600 font-bold">Зарегистрироваться</a></p>
        </div>
        
        {% if request.query_params.get("error") %}
        <div class="mt-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg text-center">
            Неверный email или пароль
        </div>
        {% endif %}
    </div>
</body>
</html>
